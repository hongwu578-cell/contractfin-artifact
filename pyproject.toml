[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractfin"
version = "0.1.0"
description = "Reproducible data and evaluation infrastructure for ContractFin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
contractfin = "contractfin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

